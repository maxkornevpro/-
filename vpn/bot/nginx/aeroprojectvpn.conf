# AeroProjectVPN — nginx location-сниппет для домена ee.aeroproject.fun
#
# Вставь эти location'ы ВНУТРЬ существующего server-блока на 443
# (того, где уже подключён SSL-сертификат от certbot для ee.aeroproject.fun).
#
# Что куда проксируется:
#   /tgapp/                     -> 127.0.0.1:9090  (Mini App backend, webapp_api.py)
#   /sub/, /api/sub/, /config/  -> 127.0.0.1:9091  (Subscription API, subscription_api.py)
#
# Порты 9090/9091 — локальные HTTP без TLS; наружу они отдаются ТОЛЬКО через
# этот 443-блок, поэтому в config.py публичные URL идут без портов.
#
# После правки:  nginx -t && systemctl reload nginx

# --- Telegram Mini App ---
location = /tgapp {
    return 301 /tgapp/;
}

location /tgapp/ {
    proxy_pass http://127.0.0.1:9090/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# --- Subscription API (выдача VPN-конфигов и ссылок) ---
location /sub/ {
    proxy_pass http://127.0.0.1:9091/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /api/sub/ {
    proxy_pass http://127.0.0.1:9091/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /config/ {
    proxy_pass http://127.0.0.1:9091/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# --- Страница со ссылками для подключения (subscription_api /app/) ---
location /app/ {
    proxy_pass http://127.0.0.1:9091/app/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
